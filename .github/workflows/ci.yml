name: CI

# Every job in this workflow runs against the stand this repository ships, so
# its result is a fact about this code and nothing else: the README badge reads
# it, and the showcase is published from it. The one check that reads somebody
# else's site -- the drift check against the public demo site -- lives in
# drift.yml, on its own schedule, so that site answering slowly or changing its
# markup can colour neither the badge nor the page.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      cross_browser:
        # Off by default, and checked by the `browsers` job below. Pressing
        # "Run workflow" is how anyone re-runs this pipeline by hand -- to
        # force a re-publication, to retry a leg that flaked -- and none of
        # those reasons is a reason to spend three times the runner minutes
        # on the browser suite. The matrix should run when somebody asks for
        # cross-browser, not when somebody asks for something else and gets it.
        description: "Also run the browser suite on Firefox and WebKit"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ".[stand]"
      - name: Run API tests against the stand
        # `TEST_ENV=local` is the default: the `local_stand` fixture starts the
        # shop in stand/ inside this process because nothing listens on 8092.
        run: pytest -m api --alluredir=allure-results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: allure-results

  framework:
    # The suite's checks of itself, including the pins that hold every number
    # on the published page, on the profile cover and in the README to what
    # pytest actually collects, plus the stand's own contract. Nothing here
    # is gated on anything else, so it runs on every push and pull request
    # exactly as the API job does; `showcase` needs it, so a stale number
    # cannot publish.
    #
    # It writes no allure-results and uploads no artifact on purpose. The
    # published page is about the marketplace -- it states the 24 checks of the
    # application and counts nothing else -- and results from this job would put
    # the framework's own cases into the figures it is meant to be guarding.
    name: Framework and stand checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ".[dev,stand]"
      - name: Lint
        run: ruff check src tests showcase scripts stand
      - name: Run the framework's own checks and the stand's contract
        run: pytest tests/unit tests/stand

  ui:
    name: UI and E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ".[stand]"
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Run UI and E2E tests against the stand
        run: pytest -m "ui or e2e" --alluredir=allure-results
        env:
          RECORD_VIDEO: "true"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ui
          path: allure-results
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: videos
          path: videos
          if-no-files-found: ignore
      # The Playwright trace of the end-to-end run: the report says what
      # happened, the trace lets anyone step through it action by action with
      # the DOM at each step. Uploaded even when the run failed -- that is when
      # it is worth the most.
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: traces
          path: traces
          if-no-files-found: ignore

  browsers:
    # The same browser suite on all three engines, and only when somebody asks
    # for it. `workflow_dispatch` is the only trigger that can reach this job,
    # so a push and a pull request never start it -- and within a manual run
    # it still waits for the `cross_browser` input, because the button is also
    # how this pipeline gets re-run for reasons that have nothing to do with
    # engines. A re-publication or a retry of a flaky leg would otherwise burn
    # three times the runner minutes to learn nothing.
    #
    # A matter of runner minutes, not of traffic against somebody else's site:
    # the suite now runs against the stand in this repository, so the cost of
    # the extra legs is entirely this pipeline's own compute. Tripling it on
    # every push would still buy nothing, because no assertion in this suite
    # is about how a page renders in one engine versus another -- the second
    # and third leg answer the same question the first already answered. The
    # engine is a setting (`Settings.browser`, read from `BROWSER`), and the
    # question "does the suite still run on Firefox and WebKit" is worth
    # asking deliberately -- after a Playwright upgrade, when a locator
    # changes, before showing the project to somebody -- which is exactly
    # when a person presses the button.
    #
    # `fail-fast: false` because the point is which engines pass. Cancelling
    # WebKit because Firefox failed would throw away the half of the answer
    # that is not yet known.
    name: Browser suite on ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.cross_browser
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ".[stand]"
      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}
      - name: Run UI and E2E tests on ${{ matrix.browser }}
        # The engine is chosen by configuration, not by a pytest flag: the
        # `browser` fixture asks `Settings.browser` for it, and that setting
        # reads `BROWSER` like every other setting in this project.
        run: pytest -m "ui or e2e" --alluredir=allure-results
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results

  showcase:
    name: Publish showcase
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [api, ui, framework]
    # Two gates, and no third one. The branch is gated here; the run being
    # green is gated by `needs`, which holds this job back until the API suite,
    # the browser suite and the framework's own checks have all passed — so a
    # red run cannot replace the published page with itself.
    #
    # Which runs reach this job, then: a push to main, and a manual dispatch
    # from main, which is how anyone re-publishes by hand. A pull request never
    # does — its `github.ref` is `refs/pull/<n>/merge`, not this branch. The
    # nightly run is not one of them any more. All it ever ran against this
    # code's own stand was the suite the push had already passed, so the
    # nightly is now the drift check alone, in drift.yml, and it publishes
    # nothing: the page is renewed by the change that renews the code, and the
    # date on it says which change that was.
    #
    # There used to be a third gate here, `github.event_name == 'push'`, and it
    # quietly made the "Run workflow" button do nothing for the one reason
    # people press it. The last re-publication had to be faked with an empty
    # commit; that is the shape of the bug it caused.
    if: github.ref == 'refs/heads/main'
    # The site goes to GitHub Pages as an artifact of this run. No branch is
    # written, so nothing is force-pushed, and nothing piles up from one
    # publication to the next; `contents: read` is for the checkout.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One publication at a time, from reading the report's history back off the
    # published site to deploying: two that overlapped would start from the
    # same history, and whichever deployed last would drop the other's run from
    # the trend. A deployment under way is never cancelled. Any other workflow
    # that ever deploys to this site has to join the same group.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # No git runs after the checkout, so the token is not left in .git/config
      # for the steps below.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The build needs Python's standard library and nothing installed: with
      # the Pages token in this job, the pinned Allure command line is the only
      # third-party code it runs. The script's tests hold the build to that.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: allure-results-api
          path: allure-results-api
      - uses: actions/download-artifact@v8
        with:
          name: allure-results-ui
          path: allure-results-ui
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: videos
          path: videos
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: traces
          path: traces
      - name: Assemble the site
        # Builds `site/` and stops: the report, its trend read back from
        # `SITE_URL`, the page, the diagrams and the media. Nothing is pushed.
        run: bash scripts/build-showcase.sh allure-results-api allure-results-ui videos traces
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: https://wolfgung.github.io/Marketplace-Test-Automation-Framework/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
